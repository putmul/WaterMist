<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — WaterMist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/watermist.css') }}">
  <link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/auth.css') }}">
  <script src="{{ url_for('frontend.static', filename='js/layout.js') }}"></script>
</head>
<body data-page="login">

  <div class="scene" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span><span class="cloud c4"></span>
  </div>

  <main class="auth">
     <a class="wordmark" href="{{ url_for('main.dashboard') }}">WATERMIST</a>
    <div class="ornament" aria-hidden="true"><i></i></div>
    <p class="subtitle">Masuk ke akun Anda</p>

    <section class="auth-panel frame" aria-label="Form masuk">
      <div class="ornament ornament--panel" aria-hidden="true"><i></i></div>

      <form class="auth-form" data-auth="login" method="post" action="{{ url_for('auth.login') }}">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <p class="form-error" role="alert">{{ message }}</p>
          {% endfor %}
        {% endwith %}

        <div class="field">
          <label class="sr-only" for="email">Alamat Email</label>
          <span class="field-icon" aria-hidden="true"><svg class="ico"><use href="#i-mail"/></svg></span>
          <input id="email" name="email" type="email" placeholder="Alamat Email" autocomplete="email" required>
        </div>

        <div class="field">
          <label class="sr-only" for="password">Password</label>
          <span class="field-icon" aria-hidden="true"><svg class="ico"><use href="#i-lock"/></svg></span>
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button class="field-toggle" type="button" data-toggle-password aria-label="Tampilkan password" aria-pressed="false">
            <svg class="ico"><use href="#i-eye"/></svg>
          </button>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Masuk</button>

        <p class="switch">Belum punya akun? <a class="link" href="{{ url_for('auth.register') }}">Daftar di sini →</a></p>
      </form>
    </section>
  </main>

  <script src="{{ url_for('frontend.static', filename='js/auth.js') }}"></script>
</body>
</html>
